        names: { guitar: 'Violão', ukulele: 'Ukulele', violin: 'Violino', cello: 'Violoncelo', bass: 'Baixo', chromatic: 'Cromático', cavaquinho: 'Cavaquinho' } }
};
var NOTE = { en: ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'], pt: ['Dó','Dó♯','Ré','Mi♭','Mi','Fá','Fá♯','Sol','Lá♭','Lá','Si♭','Si'] };
var TUNERS = [
  { id: 'guitar', href: 'Tuner.dc.html', notes: [40,45,50,55,59,64] },
  { id: 'ukulele', href: 'TunerUkulele.dc.html', notes: [67,60,64,69] },
  { id: 'violin', href: 'TunerViolin.dc.html', notes: [55,62,69,76] },
  { id: 'cello', href: 'TunerCello.dc.html', notes: [36,43,50,57] },
  { id: 'bass', href: 'TunerBass.dc.html', notes: [28,33,38,43] },
  { id: 'chromatic', href: 'TunerChromatic.dc.html', notes: [] },
  { id: 'cavaquinho', href: 'TunerCavaquinho.dc.html', notes: [62,67,71,74], ptOnly: true }
];
class Component extends DCLogic {
  constructor(...a) { super(...a); this.state = Object.assign({}, this.state || {}, { lang: 'en' }); }
  renderVals() {
    var lang = this.state.lang, t = TXT[lang], names = NOTE[lang], self = this;
    var tuners = TUNERS.filter(function (x) { return !x.ptOnly || lang === 'pt'; }).map(function (x) {
      return { href: x.href, name: t.names[x.id], notes: x.notes.length ? x.notes.map(function (m) { return names[m % 12]; }) : [t.any] };
    });
    var langs = ['en', 'pt'].map(function (id) {
      var on = id === lang;
      return { label: id.toUpperCase(), pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#090A0A' : '#EEEDF0', pick: function () { self.setState({ lang: id }); } };
    });
    return { t: t, tuners: tuners, langs: langs };
