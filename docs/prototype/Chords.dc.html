<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chord Lookup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#EEEDF0}
</style>
</helmet>
<div style="min-height: 100vh; background: #090A0A; color: #EEEDF0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="position: sticky; top: 0; z-index: 10; background: rgba(9,10,10,0.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px)">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #EEEDF0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">
        <span style="width: 34px; height: 34px; border-radius: 999px; background: #39FF88; display: flex; align-items: center; justify-content: center; color: #090A0A">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 0 1 16 0"></path><path d="M12 17l3.5-5.5"></path></svg>
        </span>
        Music Tools
      </a>
      <div role="group" aria-label="Language" style="display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: #17191B">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
          <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="min-width: 48px; height: 36px; border: none; border-radius: 999px; font: 600 13px Inter, sans-serif; cursor: pointer; background: {{l.bg}}; color: {{l.fg}}">{{l.label}}</button>
        </sc-for>
      </div>
    </div>
  </header>

  <main style="width: 100%; max-width: 1200px; box-sizing: border-box; margin: 0 auto; padding: 28px 24px 112px; display: flex; flex-direction: column; gap: 80px">
    <section style="display: flex; flex-direction: column; gap: 34px">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(2.75rem, 6vw, 5rem); line-height: 1; letter-spacing: -0.035em">{{L.title}}</h1>
        <div role="group" aria-label="{{L.instrument}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 999px; background: #17191B; width: 100%; max-width: 280px">
          <sc-for list="{{insts}}" as="i" hint-placeholder-count="2">
            <button type="button" onClick="{{i.pick}}" aria-pressed="{{i.pressed}}" style="height: 40px; border: none; border-radius: 999px; font: 600 14px Inter, sans-serif; cursor: pointer; background: {{i.bg}}; color: {{i.fg}}">{{i.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: clamp(34px, 6vw, 80px)">
        <div style="flex: 1.2 1 400px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 18px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 460px">
            <button type="button" onClick="{{transDown}}" aria-label="{{L.down}}" title="{{L.down}}" style="flex: none; width: 60px; height: 60px; border-radius: 999px; border: none; background: #17191B; color: #EEEDF0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
              <span style="font: 700 17px Inter, sans-serif; line-height: 1">−1</span>
              <span style="font-size: 10px; color: #B8BCC3; line-height: 1">{{L.semi}}</span>
            </button>
            <div aria-live="polite" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(64px, 8vw, 96px); line-height: 0.9; letter-spacing: -0.04em">{{chordName}}</span>
              <span style="font-size: 15px; color: #B8BCC3">{{spelled}}</span>
            </div>
            <button type="button" onClick="{{transUp}}" aria-label="{{L.up}}" title="{{L.up}}" style="flex: none; width: 60px; height: 60px; border-radius: 999px; border: none; background: #17191B; color: #EEEDF0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
              <span style="font: 700 17px Inter, sans-serif; line-height: 1">+1</span>
              <span style="font-size: 10px; color: #B8BCC3; line-height: 1">{{L.semi}}</span>
            </button>
          </div>

          <sc-if value="{{isGuitar}}" hint-placeholder-val="{{ true }}">
            <div role="img" aria-label="{{diagramAria}}" style="position: relative; width: 100%; max-width: 420px; height: 270px; margin-top: 8px">
              <div style="position: absolute; left: calc(12% - 20px); width: calc(76% + 40px); top: 30px; height: 240px; background: #2B1A11"></div>
              <sc-for list="{{g.frets}}" as="f" hint-placeholder-count="6">
                <div style="position: absolute; left: calc(12% - 20px); width: calc(76% + 40px); top: {{f.y}}px; height: {{f.h}}px; background: {{f.c}}"></div>
              </sc-for>
              <sc-for list="{{g.strings}}" as="s" hint-placeholder-count="6">
                <div style="position: absolute; top: 30px; height: 240px; transform: translateX(-50%); left: {{s.x}}%; width: {{s.w}}px; background: #C9CDD2"></div>
              </sc-for>
              <sc-for list="{{g.marks}}" as="m" hint-placeholder-count="6">
                <span style="position: absolute; top: 2px; width: 24px; text-align: center; transform: translateX(-50%); left: {{m.x}}%; font: 600 17px Inter, sans-serif; color: #B8BCC3; line-height: 20px">{{m.ch}}</span>
              </sc-for>
              <sc-if value="{{g.hasBase}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; left: 0; width: calc(12% - 28px); text-align: right; top: 43px; font: 700 14px Inter, sans-serif; color: #B8BCC3">{{g.baseLabel}}</span>
              </sc-if>
              <sc-if value="{{g.hasBarre}}" hint-placeholder-val="{{ false }}">
                <div style="position: absolute; height: 34px; border-radius: 17px; background: #39FF88; left: calc({{g.barre.x}}% - 17px); width: calc({{g.barre.w}}% + 34px); top: {{g.barre.y}}px"></div>
              </sc-if>
              <sc-for list="{{g.dots}}" as="d" hint-placeholder-count="4">
                <span style="position: absolute; width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; transform: translateX(-50%); font: 700 11px Inter, sans-serif; letter-spacing: -0.02em; left: {{d.x}}%; top: {{d.y}}px; background: {{d.bg}}; color: #090A0A">{{d.label}}</span>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{isPiano}}" hint-placeholder-val="{{ false }}">
            <div role="img" aria-label="{{diagramAria}}" style="position: relative; width: 100%; max-width: 480px; height: 200px; margin: 30px 0 40px; overflow: hidden; box-sizing: border-box; background: #000000; box-shadow: 0 0 0 8px #000000">
              <sc-for list="{{p.whites}}" as="w" hint-placeholder-count="14">
                <span style="position: absolute; top: 0; width: 7.1429%; height: 100%; box-sizing: border-box; border-right: 2px solid #000000; border-radius: 0 0 4px 4px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; font: 700 10px Inter, sans-serif; color: #090A0A; left: {{w.x}}%; background: {{w.bg}}">{{w.label}}</span>
              </sc-for>
              <sc-for list="{{p.blacks}}" as="b" hint-placeholder-count="10">
                <span style="position: absolute; top: 0; width: 4.6%; height: 60%; border-radius: 0 0 4px 4px; left: {{b.x}}%; background: {{b.bg}}"></span>
              </sc-for>
            </div>
          </sc-if>

          <span style="font-size: 14px; font-weight: 600; color: #B8BCC3">{{varLabel}}</span>
          <div style="display: flex; align-items: center; gap: 10px; width: 100%; max-width: 460px">
            <button type="button" onClick="{{prevVar}}" aria-label="{{L.prev}}" style="width: 60px; height: 60px; flex: none; border-radius: 999px; border: none; background: #17191B; color: #EEEDF0; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
            </button>
            <button type="button" onClick="{{play}}" style="flex: 1; height: 60px; border-radius: 999px; border: none; background: #39FF88; color: #090A0A; font: 700 17px Inter, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 30px -10px rgba(57,255,136,0.55)">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"></path></svg>
              {{L.play}} {{chordName}}
            </button>
            <button type="button" onClick="{{nextVar}}" aria-label="{{L.nextVar}}" style="width: 60px; height: 60px; flex: none; border-radius: 999px; border: none; background: #17191B; color: #EEEDF0; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
          </div>
        </div>

        <div style="flex: 1 1 340px; min-width: 0; max-width: 480px; display: flex; flex-direction: column; gap: 26px; padding-top: 8px">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; color: #B8BCC3">{{L.root}}</span>
            <div role="group" aria-label="{{L.root}}" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{roots}}" as="r" hint-placeholder-count="12">
                <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="height: 52px; border-radius: 999px; font: 700 15px Inter, sans-serif; cursor: pointer; background: {{r.bg}}; color: {{r.fg}}; border: none">{{r.label}}</button>
              </sc-for>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; color: #B8BCC3">{{L.type}}</span>
            <div role="group" aria-label="{{L.type}}" style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{types}}" as="y" hint-placeholder-count="9">
                <button type="button" onClick="{{y.pick}}" aria-pressed="{{y.pressed}}" style="height: 44px; padding: 0 18px; border-radius: 999px; font: 600 14px Inter, sans-serif; cursor: pointer; background: {{y.bg}}; color: {{y.fg}}; border: none">{{y.label}}</button>
              </sc-for>
            </div>
          </div>

          <button type="button" onClick="{{toggleMore}}" aria-expanded="{{moreStr}}" style="align-self: flex-start; min-height: 44px; padding: 0; border: none; background: none; color: #B8BCC3; font: 600 14px Inter, sans-serif; cursor: pointer; display: flex; align-items: center; gap: 6px">
            {{moreLabel}}
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{chev}}deg); transition: transform 150ms"><path d="M6 9l6 6 6-6"></path></svg>
          </button>

          <sc-if value="{{more}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 15px; font-weight: 500">{{L.naming}}</span>
              <div role="group" aria-label="{{L.naming}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 999px; background: #17191B">
                <sc-for list="{{namings}}" as="n" hint-placeholder-count="3">
                  <button type="button" onClick="{{n.pick}}" aria-pressed="{{n.pressed}}" style="height: 40px; border-radius: 999px; font: 600 13px Inter, sans-serif; cursor: pointer; background: {{n.bg}}; color: {{n.fg}}; border: none">{{n.label}}</button>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 34px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(1.75rem, 3vw, 2.5rem); letter-spacing: -0.02em">{{L.how}}</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 34px">
        <li style="display: flex; flex-direction: column; gap: 14px; font-size: 15px; line-height: 1.6; color: #B8BCC3"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; color: #39FF88">01</span>{{L.how1}}</li>
        <li style="display: flex; flex-direction: column; gap: 14px; font-size: 15px; line-height: 1.6; color: #B8BCC3"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; color: #39FF88">02</span>{{L.how2}}</li>
        <li style="display: flex; flex-direction: column; gap: 14px; font-size: 15px; line-height: 1.6; color: #B8BCC3"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; color: #39FF88">03</span>{{L.how3}}</li>
      </ol>
      <a href="Tuner.dc.html" style="align-self: flex-start; min-height: 60px; display: flex; align-items: center; gap: 18px; text-decoration: none; color: #EEEDF0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(1.5rem, 3vw, 2.25rem); letter-spacing: -0.02em">
        {{L.next}}
        <span style="width: 52px; height: 52px; border-radius: 999px; background: #39FF88; color: #090A0A; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
        </span>
      </a>
    </section>
  </main>
</div>
</x-dc>

var TXT = {

        types: { maj: 'Maior', min: 'Menor', '7': '7', maj7: '7M', m7: 'm7', sus2: 'sus2', sus4: 'sus4', dim: 'dim', aug: 'aum' },

        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        g.connect(master);
        var parts = kind === 'piano' ? [['triangle', 1, 0.8], ['sine', 2, 0.25], ['sine', 4, 0.05]] : [['triangle', 1, 0.9], ['sawtooth', 1, 0.08], ['sine', 2, 0.3]];
        parts.forEach(function (p) {
          var o = ctx.createOscillator(), og = ctx.createGain(); o.type = p[0]; o.frequency.value = f * p[1]; og.gain.value = p[2];
          o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + 0.05);
        });
      });
    } catch (e) {}
  }
  renderVals() {
    var self = this, s = this.state, L = TXT[s.lang];
    var naming = s.naming || (s.lang === 'pt' ? 'solfege' : 'abc');
    var useFlat = [3, 5, 8, 10].indexOf(s.root) >= 0 || (['min', 'm7', 'dim'].indexOf(s.type) >= 0 && [0, 2, 7].indexOf(s.root) >= 0);
    var arr = useFlat ? FLAT[naming] : SHARP[naming], rootName = ROOTS[naming][s.root];
    var nm = function (pc) { return pc === s.root ? rootName : arr[pc]; };
    var pcs = IV[s.type].map(function (iv) { return (s.root + iv) % 12; });
    var chordName = rootName + L.suffix[s.type];
    var spelled = pcs.map(nm).join(' · ');
    var isGuitar = s.inst === 'guitar';

    var g = { frets: [], strings: [], marks: [], dots: [], hasBase: false, baseLabel: '', hasBarre: false, barre: { x: 0, w: 0, y: 0 } };
    var p = { whites: [], blacks: [] }, varCount, varLabel, playNotes;
    if (isGuitar) {
      var vs = guitarVoicings(s.root, s.type); varCount = vs.length;
      var v = vs[s.vi % varCount], fr = v.frets;
      var fretted = fr.filter(function (x) { return x !== null && x > 0; });
      var maxF = fretted.length ? Math.max.apply(null, fretted) : 0;
      var base = maxF <= 4 ? 1 : Math.min.apply(null, fretted);
      var sx = function (i) { return +(12 + i * 15.2).toFixed(2); }, cy = function (f) { return 30 + (f - base + 0.5) * 44; };
      for (var k = 0; k <= 5; k++) g.frets.push({ y: k === 0 ? (base === 1 ? 24 : 29) : 29 + k * 44, h: k === 0 && base === 1 ? 8 : 3, c: k === 0 && base === 1 ? '#E9DFC8' : '#8F959B' });
      for (var i = 0; i < 6; i++) g.strings.push({ x: sx(i), w: i < 3 ? 2.5 - i * 0.25 : 1.5 });
      fr.forEach(function (f, i) {
        if (f === null) g.marks.push({ x: sx(i), ch: '×' });
        else if (f === 0) g.marks.push({ x: sx(i), ch: '○' });
        else {
          var pc = (OPEN_MIDI[i] + f) % 12, isRoot = pc === s.root;
          g.dots.push({ x: sx(i), y: cy(f) - 17, label: nm(pc), bg: isRoot ? '#FFFFFF' : '#39FF88' });
        }
      });
      if (base > 1) { g.hasBase = true; g.baseLabel = base + 'fr'; }
      if (v.barre) { g.hasBarre = true; g.barre = { x: sx(v.barre.from), w: +((v.barre.to - v.barre.from) * 15.2).toFixed(2), y: cy(v.barre.fret) - 17 }; }
      varLabel = L.pos(s.vi % varCount + 1, varCount);
      playNotes = fr.map(function (f, i) { return f === null ? null : OPEN_MIDI[i] + f; }).filter(function (x) { return x !== null; });
    } else {
      varCount = pcs.length;
      var inv = s.vi % varCount;
      var notes = IV[s.type].map(function (iv) { return 60 + s.root + iv; });
      for (var j = 0; j < inv; j++) notes[j] += 12;
      notes.sort(function (a, b) { return a - b; });
      var start = Math.floor(notes[0] / 12) * 12;
      var on = {}; notes.forEach(function (m) { on[m] = true; });
      var WP = [0, 2, 4, 5, 7, 9, 11], BP = [[1, 0], [3, 1], [6, 3], [8, 4], [10, 5]];
      for (var o = 0; o < 2; o++) {
        WP.forEach(function (pc, w) {
          var m = start + o * 12 + pc;
          p.whites.push({ x: +((o * 7 + w) * 100 / 14).toFixed(3), bg: on[m] ? '#39FF88' : '#EEEDF0', label: on[m] ? nm(pc) : '' });
        });
        BP.forEach(function (b) {
          var m = start + o * 12 + b[0];
          p.blacks.push({ x: +((o * 7 + b[1] + 1) * 100 / 14 - 2.3).toFixed(3), bg: on[m] ? '#39FF88' : '#17191B' });
        });
      }
      varLabel = L.inv[inv];
      playNotes = notes;
    }

    var setVi = function (d) { var n = varCount; self.setState({ vi: ((self.state.vi % n) + d + n) % n }); };
    var langs = ['en', 'pt'].map(function (lid) {
      var onL = lid === s.lang;
      return { label: lid.toUpperCase(), pressed: onL ? 'true' : 'false', bg: onL ? '#FFFFFF' : 'transparent', fg: onL ? '#090A0A' : '#EEEDF0', pick: function () { self.setState({ lang: lid }); } };
    });
    return {
      L: L, langs: langs,
      insts: ['guitar', 'piano'].map(function (id) {
        var onI = s.inst === id;
        return { label: L[id], pressed: onI ? 'true' : 'false', bg: onI ? '#FFFFFF' : 'transparent', fg: onI ? '#090A0A' : '#EEEDF0', pick: function () { self.setState({ inst: id, vi: 0 }); } };
      }),
      chordName: chordName, spelled: spelled,
      transDown: function () { self.setState({ root: (self.state.root + 11) % 12, vi: 0 }); },
      transUp: function () { self.setState({ root: (self.state.root + 1) % 12, vi: 0 }); },
      isGuitar: isGuitar, isPiano: !isGuitar, g: g, p: p,
      diagramAria: chordName + ' ' + L.chordOn + ': ' + spelled,
      varLabel: varLabel,
      prevVar: function () { setVi(-1); }, nextVar: function () { setVi(1); },
      play: function () { if (isGuitar) self.pluck(playNotes, 0.035, 2.2, 'guitar'); else self.pluck(playNotes, 0, 2.4, 'piano'); },
      roots: ROOTS[naming].map(function (lab, i) {
        var onR = s.root === i;
        return { label: lab, pressed: onR ? 'true' : 'false', bg: onR ? '#39FF88' : '#17191B', fg: onR ? '#090A0A' : '#EEEDF0', pick: function () { self.setState({ root: i, vi: 0 }); } };
      }),
      types: TYPES.map(function (ty) {
        var onT = s.type === ty;
        return { label: L.types[ty], pressed: onT ? 'true' : 'false', bg: onT ? '#39FF88' : '#17191B', fg: onT ? '#090A0A' : '#EEEDF0', pick: function () { self.setState({ type: ty, vi: 0 }); } };
      }),
      more: s.more, moreStr: s.more ? 'true' : 'false', moreLabel: s.more ? L.less : L.more, chev: s.more ? 180 : 0,
      toggleMore: function () { self.setState({ more: !self.state.more }); },
      namings: ['abc', 'solfege', 'german'].map(function (id) {
        var onN = naming === id;
        return { label: L.namings[id], pressed: onN ? 'true' : 'false', bg: onN ? '#39FF88' : 'transparent', fg: onN ? '#090A0A' : '#EEEDF0', pick: function () { self.setState({ naming: id }); } };
      })
    };
  }
}
