name: IndexNow

# Vercel reports each deployment back to GitHub. When a production deployment succeeds, submit the
# sitemap's URLs to IndexNow so Bing and the other IndexNow engines pick up changed pages quickly.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  submit:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/indexnow.mjs
